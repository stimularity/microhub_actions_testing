name: Build Desktop App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # --- START R SHINYLIVE EXPORT SYSTEM ---
      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install and Run Shinylive Export
        run: |
          options(repos = c(CRAN = "https://r-project.org"))
          install.packages(c("shiny", "shinylive"))
          # Exports shiny app code into static assets for Tauri's frontend
          shinylive::export(appdir = ".", destdir = "src/dist")
        shell: Rscript {0}
      # --- END R SHINYLIVE EXPORT SYSTEM ---

      # Tauri action requires a package.json file to map dependencies, even if minimal
      - name: Initialize Dummy Frontend Config (If missing)
        run: |
          if [ ! -f package.json ]; then
            echo '{"name":"shiny-tauri","version":"1.0.0","private":true,"scripts":{"tauri":"tauri"}}' > package.json
            npm install @tauri-apps/cli
          else
            npm install
          fi
        shell: bash

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build Tauri Desktop Applications
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__

      - name: Upload Native Desktop Bundles
        uses: actions/upload-artifact@v4
        with:
          name: DesktopApp-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

