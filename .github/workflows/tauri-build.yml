name: Build Tauri R-Shiny Desktop App

on:
  workflow_dispatch: # Triggers only when manually launched via the GitHub Actions tab

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # NOTE: the shinylive export step was removed here. webR has no wasm
      # builds of INLA/epiprocess/simplets and no subprocess support for the
      # FourCAT Python model, so the app now runs against a real R process
      # started by Tauri. Stage 2 adds the bundled R runtime to this workflow;
      # until then the built app will report that it cannot find R.

      # tauri-action runs `npm run tauri build`, so the CLI must be installed
      - name: Install Frontend Dependencies
        run: npm ci
        shell: bash

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Publishes to a GitHub Release so the .dmg downloads directly:
      # upload-artifact would always wrap the bundles in a .zip.
      - name: Build and Publish Tauri Desktop Applications
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: MicroHub v__VERSION__
          releaseDraft: false
          prerelease: false
