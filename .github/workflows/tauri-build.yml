name: Build Tauri R-Shiny Desktop App

on:
  workflow_dispatch: # Triggers only when manually launched via the GitHub Actions tab

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # --- START R SHINYLIVE EXPORT SYSTEM ---
      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          # Automatically hooks up pre-compiled Linux binaries for the Ubuntu runner
          use-public-rspm: true

      - name: Install and Run Shinylive Export
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          
          # Dropped type="binary" to allow R to automatically select the optimal method per OS
          install.packages(c("shiny", "shinylive"))
          
          # Create targets folder safely 
          dir.create("src/dist", recursive = TRUE, showWarnings = FALSE)
          
          # Safely export the root directory app.R assets
          shinylive::export(appdir = getwd(), destdir = "src/dist")
        shell: Rscript {0}
      # --- END R SHINYLIVE EXPORT SYSTEM ---

      # tauri-action runs `npm run tauri build`, so the CLI must be installed
      - name: Install Frontend Dependencies
        run: npm ci
        shell: bash

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Publishes to a GitHub Release so the .dmg downloads directly:
      # upload-artifact would always wrap the bundles in a .zip.
      - name: Build and Publish Tauri Desktop Applications
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: MicroHub v__VERSION__
          releaseDraft: false
          prerelease: false
