name: Build Tauri R-Shiny Desktop App

on:
  workflow_dispatch: # Triggers only when manually launched via the GitHub Actions tab

jobs:
  # Stage 2: the offline R + Python runtime. Slow (~1h) and independent of the
  # Rust build, so it lives in its own reusable workflow.
  runtime:
    uses: ./.github/workflows/build-runtime.yml

  build:
    needs: runtime
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # The Shiny app itself, copied verbatim into the bundle. app.R sources
      # R/, ui/ and server/ and reads data/ relative to its working directory,
      # which Tauri sets to this folder.
      - name: Stage app payload
        run: |
          mkdir -p src-tauri/resources/app
          cp app.R src-tauri/resources/app/
          cp -R R ui server www data src-tauri/resources/app/
          du -sh src-tauri/resources/app

      - name: Download runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: macos-runtime
          path: src-tauri/resources

      - name: Check staged resources
        run: |
          mv src-tauri/resources/microhub-runtime-arm64.tar.zst src-tauri/resources/runtime.tar.zst
          ls -lh src-tauri/resources
          test -f src-tauri/resources/runtime.tar.zst
          test -f src-tauri/resources/app/app.R

      # tauri-action runs `npm run tauri build`, so the CLI must be installed
      - name: Install Frontend Dependencies
        run: npm ci
        shell: bash

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Publishes to a GitHub Release so the .dmg downloads directly:
      # upload-artifact would always wrap the bundles in a .zip.
      - name: Build and Publish Tauri Desktop Applications
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: MicroHub v__VERSION__
          releaseDraft: false
          prerelease: false

      - name: Verify the bundle contains the runtime and app
        run: |
          app="src-tauri/target/release/bundle/macos/MicroHub.app"
          test -f "$app/Contents/Resources/runtime.tar.zst"
          test -f "$app/Contents/Resources/app/app.R"
          test -d "$app/Contents/Resources/app/data"
          du -sh "$app"
          ls -lh src-tauri/target/release/bundle/dmg/*.dmg
